name: Minify JS

on:
  push:
    branches: [main]
    paths:
      - 'whatsapp-bubble.js'
      - 'VERSION'

jobs:
  minify:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read VERSION
        id: version
        run: echo "version=$(cat VERSION 2>/dev/null || echo '0.0.0')" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Terser
        run: npm install -g terser

      - name: Minify
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "/**" > banner.txt
          echo " * WhatsApp Chat Bubble – Vanilla JS Plugin v${VERSION}" >> banner.txt
          echo " * https://github.com/Avanxo-Technology/wp-bubble-message" >> banner.txt
          echo " *" >> banner.txt
          echo " * Self-contained widget with Web Audio API sounds (no external files)." >> banner.txt
          echo " * Dark mode support via prefers-color-scheme." >> banner.txt
          echo " *" >> banner.txt
          echo " * USAGE:" >> banner.txt
          echo " *   <script src=\"whatsapp-bubble.min.js\"" >> banner.txt
          echo " *     data-phone=\"573001234567\"" >> banner.txt
          echo " *     data-name=\"Mi Empresa\"" >> banner.txt
          echo " *     data-color=\"#25D366\"" >> banner.txt
          echo " *     data-sound=\"pop|ding|bubble|chime|slide|none\"" >> banner.txt
          echo " *     data-position=\"right|left\"" >> banner.txt
          echo " *     data-show-call=\"true|false\" data-show-video=\"true|false\"" >> banner.txt
          echo " *     data-dismiss=\"none|session|persistent\"" >> banner.txt
          echo " *   ></script>" >> banner.txt
          echo " *" >> banner.txt
          echo " * API: WhatsAppBubble.update(config) | WhatsAppBubble.destroy() | WhatsAppBubble.playSound()" >> banner.txt
          echo " * LICENSE: MIT" >> banner.txt
          echo " */" >> banner.txt
          terser whatsapp-bubble.js \
            --compress drop_console=true,drop_debugger=true \
            --mangle toplevel=true \
            --output whatsapp-bubble.min.js
          cat banner.txt whatsapp-bubble.min.js > temp.js && mv temp.js whatsapp-bubble.min.js

      - name: Get file size
        run: |
          echo "Version: ${{ steps.version.outputs.version }}"
          echo "Original: $(wc -c < whatsapp-bubble.js) bytes"
          echo "Minified: $(wc -c < whatsapp-bubble.min.js) bytes"

      - name: Commit minified file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add whatsapp-bubble.min.js
          git diff --cached --quiet || git commit -m "chore: minify v${{ steps.version.outputs.version }} [skip ci]"
          git push
