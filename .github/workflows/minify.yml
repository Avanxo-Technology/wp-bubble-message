name: Minify JS

on:
  push:
    branches: [main]
    paths:
      - 'whatsapp-bubble.js'

jobs:
  minify:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Terser
        run: npm install -g terser

      - name: Minify and add banner
        run: |
          printf '/**\n' > banner.txt
          printf ' * WhatsApp Chat Bubble – Vanilla JS Plugin v1.0\n' >> banner.txt
          printf ' * https://github.com/Avanxo-Technology/wp-bubble-message\n' >> banner.txt
          printf ' *\n' >> banner.txt
          printf ' * Self-contained widget with Web Audio API sounds (no external files).\n' >> banner.txt
          printf ' * Dark mode support via prefers-color-scheme.\n' >> banner.txt
          printf ' *\n' >> banner.txt
          printf ' * USAGE:\n' >> banner.txt
          printf ' *   <script src="whatsapp-bubble.min.js"\n' >> banner.txt
          printf ' *     data-phone="573001234567"\n' >> banner.txt
          printf ' *     data-name="Mi Empresa"\n' >> banner.txt
          printf ' *     data-color="#25D366"\n' >> banner.txt
          printf ' *     data-sound="pop|ding|bubble|chime|slide|none"\n' >> banner.txt
          printf ' *     data-position="right|left"\n' >> banner.txt
          printf ' *     data-dismiss="none|session|persistent"\n' >> banner.txt
          printf ' *   ></script>\n' >> banner.txt
          printf ' *\n' >> banner.txt
          printf ' * API: WhatsAppBubble.update(config) | WhatsAppBubble.destroy()\n' >> banner.txt
          printf ' * LICENSE: MIT\n' >> banner.txt
          printf ' */\n' >> banner.txt
          terser whatsapp-bubble.js \
            --compress drop_console=true,drop_debugger=true \
            --mangle toplevel=true \
            --output whatsapp-bubble.min.js
          cat banner.txt whatsapp-bubble.min.js > temp.js && mv temp.js whatsapp-bubble.min.js

      - name: Get file size
        run: |
          echo "Original: $(wc -c < whatsapp-bubble.js) bytes"
          echo "Minified: $(wc -c < whatsapp-bubble.min.js) bytes"

      - name: Commit minified file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add whatsapp-bubble.min.js
          git diff --cached --quiet || git commit -m "chore: minify whatsapp-bubble.js [skip ci]"
          git push
