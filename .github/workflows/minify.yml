name: Minify JS

on:
  push:
    branches: [main]
    paths:
      - 'whatsapp-bubble.js'
  workflow_dispatch:

jobs:
  minify:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Terser
        run: npm install -g terser

      - name: Create banner comment
        run: |
          cat > banner.txt << 'BANNER'
/**
 * WhatsApp Chat Bubble – Vanilla JS Plugin v1.0
 * https://github.com/Avanxo-Technology/wp-bubble-message
 *
 * Self-contained widget with Web Audio API sounds (no external files).
 * Dark mode support via prefers-color-scheme.
 *
 * USAGE:
 *   <script src="whatsapp-bubble.min.js"
 *     data-phone="573001234567"
 *     data-name="Mi Empresa"
 *     data-avatar="https://example.com/logo.png"
 *     data-color="#25D366"
 *     data-bubble-icon="whatsapp|chat"
 *     data-bubble-size="56"
 *     data-sound="pop|ding|bubble|chime|slide|none"
 *     data-greeting="Tu mensaje de bienvenida"
 *     data-default-message="Mensaje prellenado"
 *     data-teaser="Texto del teaser"
 *     data-teaser-subtitle="Subtítulo del teaser"
 *     data-position="right|left"
 *     data-dismiss="none|session|persistent"
 *     data-trigger-id="element-id"
 *     data-panel-width="340"
 *     data-online-text="En línea"
 *     data-input-placeholder="Escribe tu mensaje…"
 *     data-footer-note="Nota al pie"
 *   ></script>
 *
 * API (after load):
 *   WhatsAppBubble.update(config) – Update config and rebuild
 *   WhatsAppBubble.destroy()      – Remove widget from DOM
 *
 * SOUNDS: Generated via Web Audio API oscillators.
 *         Only plays after first user gesture (click/tap/key).
 *
 * LICENSE: MIT
 */
          BANNER

      - name: Minify with banner
        run: |
          BANNER=$(cat banner.txt)
          terser whatsapp-bubble.js \
            --compress drop_console=true,drop_debugger=true \
            --mangle toplevel=true \
            --output whatsapp-bubble.min.js
          echo "$BANNER" | cat - whatsapp-bubble.min.js > temp.js && mv temp.js whatsapp-bubble.min.js

      - name: Get file size
        run: |
          echo "Original: $(wc -c < whatsapp-bubble.js) bytes"
          echo "Minified: $(wc -c < whatsapp-bubble.min.js) bytes"

      - name: Commit minified file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add whatsapp-bubble.min.js
          git diff --cached --quiet || git commit -m "chore: minify whatsapp-bubble.js [skip ci]"
          git push
